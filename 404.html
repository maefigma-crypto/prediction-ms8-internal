<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — ScoreOcs8</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070a16">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#070a16;--card:#0f1620;--border:rgba(255,255,255,.10);--accent:#f97316;--text:#e8edf5;--text2:#8a9ab5;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.box{max-width:520px;text-align:center;}
.code{font-size:96px;font-weight:800;letter-spacing:-2px;background:linear-gradient(135deg,#ff8a3a,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;}
h1{font-size:24px;margin:14px 0 10px;}
p{color:var(--text2);font-size:15px;line-height:1.6;margin-bottom:26px;}
.links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.links a{display:inline-block;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:600;text-decoration:none;transition:all .2s;}
.primary{background:var(--accent);color:#fff;}
.primary:hover{filter:brightness(1.1);}
.ghost{border:1px solid var(--border);color:var(--text);}
.ghost:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>This page kicked the ball out of play</h1>
  <p>The page you're looking for doesn't exist or has moved — match pages expire once fixtures are long finished. Head back to today's predictions instead.</p>
  <div class="links">
    <a class="primary" href="/">Today's Predictions</a>
    <a class="ghost" href="/predictions/">All Leagues</a>
    <a class="ghost" href="/blog/">Blog</a>
  </div>
</div>
</body>
</html>
