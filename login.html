<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Register - ScoreOcs8</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://scoreocs8.pages.dev/register.html">
<meta http-equiv="refresh" content="0; url=/register.html">
<script>
const target = new URL('/register.html', window.location.origin);
window.location.search.replace(/^\?/, '').split('&').filter(Boolean).forEach(pair => {
  const [key, value = ''] = pair.split('=');
  target.searchParams.set(decodeURIComponent(key), decodeURIComponent(value));
});
window.location.replace(target.toString());
</script>
</head>
<body>
<a href="/register.html">Continue to register</a>
</body>
</html>
